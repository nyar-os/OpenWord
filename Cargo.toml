[workspace]
resolver = "2"
members = ["projects/sub_projects", "projects/crates/*"]
default-members = ["projects/crates/napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
authors = ["OpenWord Authors"]
repository = "https://github.com/nyar-os/OpenWord"

[workspace.dependencies]
# Shared host facade for the Node-API and WebView surfaces. Cross-repo git
# dependencies pin the full 40-character revision so local builds and CI resolve
# the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Document engine primitives. The revision is pinned so local builds and CI
# resolve the same semantic IR and format adapters.
document-ir = { git = "https://github.com/oovm/rust-boost", rev = "61a52cc73396957f63df39aeaf6d42d7904e907b" }
document-session = { git = "https://github.com/oovm/rust-boost", rev = "61a52cc73396957f63df39aeaf6d42d7904e907b" }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "61a52cc73396957f63df39aeaf6d42d7904e907b", default-features = false }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "61a52cc73396957f63df39aeaf6d42d7904e907b", default-features = false, features = ["docx", "pdf", "html", "markdown", "rtf"] }

[profile.release]
lto = true
panic = "abort"
