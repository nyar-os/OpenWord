name: TypeScript

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  examples:
    name: examples (staged binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: pnpm install --no-frozen-lockfile
        working-directory: projects
      - name: Build the native binding
        run: cargo build -p open-word-napi
      - name: Stage the addon under the extension Node loads
        run: cp target/debug/libopen_word_napi.so target/debug/open_word_napi.node
      - name: Compile the package sources
        run: pnpm --filter @wae/open-word run build:test
        working-directory: projects
      - name: Run the offer workflow example against the real engine
        run: node projects/packages/open-word/dist-test/examples/offer-workflow.js
        env:
          OPEN_WORD_NATIVE: ${{ github.workspace }}/target/debug/open_word_napi.node
      - name: Run the SDK tests against the real engine
        run: pnpm --filter @wae/open-word test
        working-directory: projects
        env:
          OPEN_WORD_NATIVE: ${{ github.workspace }}/target/debug/open_word_napi.node
